$kind: http-request
name: Login
method: POST
url: "{{baseUrl}}/auth/login"
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "peterparker@example.com",
      "password": "spiderman"
    }
scripts:
  - type: afterResponse
    code: >-
      const res = pm.response.json();

      if (res.accessToken) pm.collectionVariables.set("accessToken",
      res.accessToken);

      if (res.refreshToken) pm.collectionVariables.set("refreshToken",
      res.refreshToken);
    language: text/javascript
